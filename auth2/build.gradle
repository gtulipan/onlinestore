plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.onlinestore.auth2'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'

	implementation 'org.springframework.security:spring-security-core:6.5.0'
	implementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.0'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.0'
	implementation 'org.springframework.security:spring-security-oauth2-jose:6.5.0'

	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc:3.5.0'

	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.8'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.30'
	implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.0'

	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
	implementation 'ch.qos.logback:logback-core:1.5.18'
	implementation 'ch.qos.logback:logback-classic:1.5.18'

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	implementation 'org.hibernate.validator:hibernate-validator:9.0.0.Final'
	implementation 'jakarta.validation:jakarta.validation-api:3.1.1'

	implementation 'org.liquibase:liquibase-core'
	implementation 'io.r2dbc:r2dbc-postgresql:0.8.13.RELEASE'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2:2.3.232'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc:3.5.0'
	testImplementation 'ch.qos.logback:logback-classic:1.5.18'
	testImplementation 'org.springframework.security:spring-security-test:6.5.0'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner:4.2.1'
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorPath = configurations.annotationProcessor
}

test {
	useJUnitPlatform()
}

sourceSets {
	main {
		resources {
			srcDirs = ['src/main/resources']
			includes = ['**/*.*']
		}
	}
	test {
		java.srcDirs = ['src/test/java/unit', 'src/test/java/intg']
	}
}

bootJar {
	manifest {
		attributes(
				'Main-Class': 'org.springframework.boot.loader.launch.JarLauncher',
				'Start-Class': 'com.onlinestore.auth2.Auth2Application'
		)
	}
	archiveFileName = 'auth2service.jar'
}
