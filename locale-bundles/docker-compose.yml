services:
  locale-bundles:
    env_file:
      - .env
    build:
      context: .
      args:
        LOG_FOLDER: ${LOG_FOLDER}
        LOCAL_BUNDLES_SERVICE_PORT: ${LOCAL_BUNDLES_SERVICE_PORT}
        LOCAL_BUNDLES_SERVICE_DEBUG_PORT: ${LOCAL_BUNDLES_SERVICE_DEBUG_PORT}
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${LOCAL_BUNDLES_SERVICE_DEBUG_PORT:5006}
      - LOCAL_BUNDLES_SERVICE_PORT=${LOCAL_BUNDLES_SERVICE_PORT}
      - LOCAL_BUNDLES_SERVICE_DEBUG_PORT: ${LOCAL_BUNDLES_SERVICE_DEBUG_PORT:5006}
      - LOG_FOLDER=${LOG_FOLDER}
      - AUTH2_HOST=${AUTH2_HOST}
      - AUTH2_PORT=${AUTH2_PORT}
    ports:
      - "${LOCAL_BUNDLES_SERVICE_PORT}:${LOCAL_BUNDLES_SERVICE_PORT}"
      - "${LOCAL_BUNDLES_SERVICE_DEBUG_PORT}:${LOCAL_BUNDLES_SERVICE_DEBUG_PORT}"
    container_name: locale-bundles
    networks:
      - online-store-network

networks:
  online-store-network:
    name: online-store-network
    driver: bridge
    attachable: true
