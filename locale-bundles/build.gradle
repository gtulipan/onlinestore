plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.onlinestore.locale_bundles'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    implementation("org.springframework.security:spring-security-config:6.5.0")
    implementation("org.springframework.security:spring-security-web:6.5.0")

    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    implementation 'ch.qos.logback:logback-core:1.5.18'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.8'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.30'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.0'

    implementation 'org.hibernate.validator:hibernate-validator:9.0.0.Final'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
            includes = ['**/*.*']
        }
    }
    test {
        java.srcDirs = ['src/test/java', 'src/test/java']
    }
}

bootJar {
    manifest {
        attributes(
                'Main-Class': 'org.springframework.boot.loader.launch.JarLauncher',
                'Start-Class': 'com.onlinestore.locale_bundles.LocaleBundlesApplication'
        )
    }
    archiveFileName = 'locale_bundles.jar'
}
